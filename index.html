<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Événement 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <div class="event-title">
            Forum 2026
        </div>

        <div id="participant">
            Chargement...
        </div>

    </main>

    <script src="data.js"></script>

    <script>

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        const personne = participants[id];

        const zone = document.getElementById("participant");

        if (personne) {

            zone.innerHTML = `
                <img
                    class="photo"
                    src="${personne.photo}"
                    alt="Photo de ${personne.prenom} ${personne.nom}"
                >

                <h1 class="name">
                    ${personne.prenom} ${personne.nom}
                </h1>

                <p class="role">
                    ${personne.fonction}
                </p>

                <p class="id">
                    ID ${id}
                </p>
            `;

        } else {

            zone.innerHTML = `
                <h2>Participant introuvable</h2>
                <p>Vérifiez le lien utilisé.</p>
            `;

        }

    </script>

</body>

</html>
